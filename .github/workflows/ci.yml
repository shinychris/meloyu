# Meloyu CI（P1-5）：backend lint + 单测 / frontend 类型检查 + 测试 + 构建，双 job 并行
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend (ruff + unittest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与 backend/pyproject.toml 的 requires-python = ">=3.12" 下限对齐
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check app
        # ruff 配置位于 backend/pyproject.toml，按文件位置自动向上发现

      - name: Unit tests
        run: python -m unittest discover -s tests -v
        # tests/test_i18n.py import app 包，cwd=backend 保证 app 可导入

  frontend:
    name: frontend (typecheck + vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, typecheck, test, build
        run: cd frontend && npm ci && npm run typecheck && npm test && npm run build

  docker:
    # P1-14/15（2026-09-26）：镜像可构建性门禁——Dockerfile 与 requirements.lock
    # 变更若无构建验证，坏掉只会在下次发布时被发现。只 build 不 push。
    name: docker (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./deploy/backend.Dockerfile
          push: false
          tags: meloyu/backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./deploy/frontend.Dockerfile
          push: false
          tags: meloyu/frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
