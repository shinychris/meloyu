# Meloyu CI（P1-5）：backend lint + 单测 / frontend 类型检查 + 测试 + 构建，双 job 并行
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend (ruff + unittest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与 backend/pyproject.toml 的 requires-python = ">=3.12" 下限对齐
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check app
        # ruff 配置位于 backend/pyproject.toml，按文件位置自动向上发现

      - name: Unit tests
        run: python -m unittest discover -s tests -v
        # tests/test_i18n.py import app 包，cwd=backend 保证 app 可导入

  backend-pg:
    # v0.15.0 起 PostgreSQL 为主库：同一套测试对真实 PG 跑一遍（方言门禁——
    # ILIKE/CHECK 约束/并发 upsert 等语义差异在 SQLite 上测不出来）
    name: backend (unittest @ postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meloyu
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: meloyu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meloyu -d meloyu_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit tests (PostgreSQL)
        run: python -m unittest discover -s tests -v
        env:
          MELOYU_TEST_DATABASE_URL: postgresql+psycopg2://meloyu:testpw@127.0.0.1:5432/meloyu_test

  frontend:
    name: frontend (typecheck + vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, typecheck, test, build
        run: cd frontend && npm ci && npm run typecheck && npm test && npm run build

  docker:
    # P1-14/15（2026-09-26）：镜像可构建性门禁——Dockerfile 与 requirements.lock
    # 变更若无构建验证，坏掉只会在下次发布时被发现。只 build 不 push。
    name: docker (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./deploy/backend.Dockerfile
          push: false
          tags: meloyu/backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./deploy/frontend.Dockerfile
          push: false
          tags: meloyu/frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
