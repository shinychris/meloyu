# Meloyu 本地生产环境（Docker Compose）
#
# 网络隔离设计（与其他容器互不可达）：
# - 独立 bridge 网络 meloyu-prod-net：与 aisag-prod-net / fastgpt_* / lmts-prod-net 等
#   其他自定义网络二层隔离，跨网络容器互相无法 DNS 解析 / 直连；
# - 对宿主机发布前端入口 0.0.0.0:8180（局域网可达；2026-09-06 应用户要求从
#   仅回环放开；后端仍不发布端口，仅经 nginx 反代对外）；
# - 后端不发布任何宿主机端口，仅经 nginx 反代对外；
# - 出网不受限（MiniMax / Stripe / SMTP 等云端通道正常）。
#
# 数据策略：bind 挂载仓库 backend/data → /app/data（SQLite + 音频 + 日志），
# 延续既有数据。⚠ 宿主机 dev uvicorn（--port 8000）必须停用后才能启动本栈
# （SQLite WAL 多写入方并发有损坏风险），见 README.md。
name: meloyu

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    image: meloyu/backend:prod
    container_name: meloyu-backend
    restart: unless-stopped
    # P1-13：默认 10s 后 SIGKILL 对写库线程太粗暴（可能留脏 WAL）；给足
    # 优雅退出窗口（uvicorn SIGTERM → 在写事务提交后退出）
    stop_grace_period: 60s
    env_file: .env.prod
    environment:
      # 容器内固定值（优先级高于 env_file，防误配）
      HOST: 0.0.0.0
      PORT: "8000"
      ENV: production
      DATA_DIR: /app/data
      # 2026-09-09 安审计 H1：限流取信反代注入的客户端 IP（nginx 已以
      # $remote_addr 覆写 X-Forwarded-For / X-Real-IP，客户端不可伪造）。
      # 直连部署（无反代）时必须为 false——否则伪造 XFF 可绕过全部 IP 限流
      TRUST_PROXY: "true"
    # GPU 直通：ACE-Step/MusicGen 本地推理用（本机 nvidia-container-runtime 已
    # 验证可用，RTX 4060 Ti 8GB）。⚠ 若宿主机 GPU 不可用（驱动卸载等），此行
    # 会让 backend 起不来——届时删除 gpus 行重启即可（本地通道受影响，
    # 云端通道不受影响）。
    gpus: all
    volumes:
      - type: bind
        source: ../backend/data
        target: /app/data
    networks:
      - meloyu-prod-net
    security_opt:
      - no-new-privileges:true
    # 2026-09-09 安审计 I2：容器内全部进程为非特权用户（appuser，bind 8000/
    # 读写 /app/data 均不需要 Linux capability），全量摘除
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/frontend.Dockerfile
    image: meloyu/frontend:prod
    container_name: meloyu-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 监听 0.0.0.0：局域网经 http://<本机IP>:8180 访问；要收回仅本机访问改回 "127.0.0.1:8180:8080"
      # （容器内为非特权 nginx，监听 8080）
      - "0.0.0.0:8180:8080"
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    networks:
      - meloyu-prod-net
    security_opt:
      - no-new-privileges:true
    # 非特权镜像（uid 101，监听 8080>1024）——无需任何 capability
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  meloyu-prod-net:
    name: meloyu-prod-net
    driver: bridge
