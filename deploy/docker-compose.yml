# Meloyu 本地生产环境（Docker Compose）
#
# 网络隔离设计（与其他容器互不可达）：
# - 独立 bridge 网络 meloyu-prod-net：与 aisag-prod-net / fastgpt_* / lmts-prod-net 等
# 其他自定义网络二层隔离，跨网络容器互相无法 DNS 解析 / 直连；
# - 对宿主机发布前端入口 0.0.0.0:8180（局域网可达；2026-09-06 应用户要求从
# 仅回环放开；后端仍不发布端口，仅经 nginx 反代对外）；
# - 后端不发布任何宿主机端口，仅经 nginx 反代对外；
# - 出网不受限（MiniMax / Stripe / SMTP 等云端通道正常）。
#
# 数据策略（v0.15.0 起）：
# - PostgreSQL 为主库：postgres 服务 + 命名卷 meloyu-pgdata（WSL ext4，勿用
# Windows bind mount——NTFS 上 PG 的 fsync/权限语义不可靠）；连接串在
# .env.prod 的 DATABASE_URL 配置（生产启动断言强制 PG）。
# - backend/data 仍 bind 挂载 → /app/data（音频产物 + 日志 + backups/；
# 应用内每日 03:30 PG COPY 转储与音频增量镜像都落这里）。
# - 旧 SQLite 单写入方红线（dev uvicorn 与本栈不得同时写 meloyu.db）随切库
# 解除：PG 为 MVCC 多写入方模型，dev 起本地实例不受影响（仍应指向独立
# dev 库避免数据混淆）。
# - Supabase 云库替代方案：注释掉本服务与 backend 的 depends_on.postgres，
# .env.prod 的 DATABASE_URL 指向 Supabase 连接串。
name: meloyu

services:
  postgres:
    # digest 固定（与 backend.Dockerfile 同一约定：tag 可被上游移动）
    # 基础镜像走 daocloud 加速源（本机 Docker Hub 直连不可达）
    image: docker.m.daocloud.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: meloyu-postgres
    restart: unless-stopped
    # POSTGRES_USER/DB 固定；POSTGRES_PASSWORD 经 env_file 从 .env.prod 注入
    env_file: .env.prod
    environment:
      POSTGRES_USER: meloyu
      POSTGRES_DB: meloyu
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 宿主机侧管理/迁移入口（仅本机回环；迁移脚本与 psql/pgAdmin 用）
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meloyu -d meloyu"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - meloyu-prod-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    image: meloyu/backend:prod
    container_name: meloyu-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # 默认 10s 后 SIGKILL 对写库线程太粗暴（可能留脏 WAL）；给足
    # 优雅退出窗口（uvicorn SIGTERM → 在写事务提交后退出）
    stop_grace_period: 60s
    env_file: .env.prod
    environment:
      # 容器内固定值（优先级高于 env_file，防误配）
      HOST: 0.0.0.0
      PORT: "8000"
      ENV: production
      DATA_DIR: /app/data
      # 2026-09-09  H1：限流取信反代注入的客户端 IP（nginx 已以
      # $remote_addr 覆写 X-Forwarded-For / X-Real-IP，客户端不可伪造）。
      # 直连部署（无反代）时必须为 false——否则伪造 XFF 可绕过全部 IP 限流
      TRUST_PROXY: "true"
    # GPU 直通：ACE-Step/MusicGen 本地推理用（本机 nvidia-container-runtime 已
    # 验证可用，RTX 4060 Ti 8GB）。⚠ 若宿主机 GPU 不可用（驱动卸载等），此行
    # 会让 backend 起不来——届时删除 gpus 行重启即可（本地通道受影响，
    # 云端通道不受影响）。
    gpus: all
    volumes:
      - type: bind
        source: ../backend/data
        target: /app/data
    networks:
      - meloyu-prod-net
    # 2026-09-26 v0.14.0：摘除 no-new-privileges——本机 Docker Desktop
    # （Win11 24H2/WSL2，runc seccomp errno 524 间歇性 bug）下 NNP 会让容器
    # 无法启动。安全基线保留：非 root 用户 + cap_drop ALL + 基础镜像 digest
    # 固定（slim 镜像无 setuid 二进制，NNP 在此形态本为纵深冗余项）；
    # 引擎修复后可恢复 security_opt 配置。
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/frontend.Dockerfile
    image: meloyu/frontend:prod
    container_name: meloyu-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 监听 0.0.0.0：局域网经 http://<本机IP>:8180 访问；要收回仅本机访问改回 "127.0.0.1:8180:8080"
      # （容器内为非特权 nginx，监听 8080）
      - "0.0.0.0:8180:8080"
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    networks:
      - meloyu-prod-net
    # 2026-09-26：同 backend 摘除 no-new-privileges（seccomp errno 524 bug）
    # 非特权镜像（uid 101，监听 8080>1024）——无需任何 capability
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  meloyu-prod-net:
    name: meloyu-prod-net
    driver: bridge

volumes:
  pgdata:
    name: meloyu-pgdata
