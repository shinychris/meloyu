# Meloyu 前端站点：SPA 路由回退 + /api 反代后端容器
# 由 docker-compose 以只读卷挂载到 /etc/nginx/conf.d/default.conf
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 音频流式响应经 /api/v1/files/** 下发：关缓冲、放宽超时
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # SPA 前端：静态资源直接命中，其余路由回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代 → meloyu-backend:8000（仅 meloyu-prod-net 网络内可达）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # Vite 构建产物带内容哈希，长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
