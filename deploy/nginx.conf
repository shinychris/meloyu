# Meloyu 前端站点：SPA 路由回退 + /api 反代后端容器
# 由 docker-compose 以只读卷挂载到 /etc/nginx/conf.d/default.conf
#
# 安全基线（2026-09-09 安审计 M5/L1/H1）：
# - server_tokens off：不回显 nginx 版本号（版本指纹收敛）
# - 全套安全响应头（CSP/frames/nosniff/Referrer/Permissions）——nginx 的
#   add_header 继承规则是"location 内出现任一 add_header 即不再继承 server 级"，
#   故 /assets/（自带 Cache-Control 头）里必须重复声明全套
# - X-Forwarded-For 以 $remote_addr 覆写：丢弃客户端自带的伪造 XFF 链——
#   后端限流按 IP 计数（ratelimit.py），透传原链=可轮换假 IP 绕过登录限流
server {
    # 8080：非特权镜像（nginx-unprivileged，uid 101）不可绑 <1024 端口；
    # 宿主机 8180 经 compose 端口映射到此
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ---- 安全响应头（全站默认；location 级 add_header 不继承，需局部重复） ----
    # CSP：脚本仅同源（Vite 产物无内联脚本）；样式放开 unsafe-inline（React
    # 458 处内联 style 属性）；Google Fonts 为唯一外部依赖；音频流同源 + blob
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # microphone 保留（哼唱成歌/人声克隆的 getUserMedia 录音）
    add_header Permissions-Policy "camera=(), geolocation=(), payment=()" always;
    # COOP/CORP：跨域 opener 隔离 + 资源跨域读取隔离（2026-09-09 补充）
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 音频流式响应经 /api/v1/files/** 下发：关缓冲、放宽超时
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # SPA 前端：静态资源直接命中，其余路由回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代 → meloyu-backend:8000（仅 meloyu-prod-net 网络内可达）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆写而非追加（$proxy_add_x_forwarded_for 会保留客户端伪造的链首）
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # v0.10.2：对齐后端各上传上限（mixdown 240s 48kHz 立体声 wav ≈46MB、
        # 参考轨 mono 22.05kHz 8 分钟 ≈21MB；后端 mixdown 校验 200MB）。
        # 旧值 20m 使这两类上传在生产栈必被 413（dev Vite 代理无此限制，测不出）
        client_max_body_size 200m;
    }

    # Vite 构建产物带内容哈希，长缓存
    # ⚠ 本 location 有自己的 add_header（Cache-Control），nginx 规则导致上方
    # server 级安全头在此不生效——必须整套重复声明
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=()" always;
    # COOP/CORP：跨域 opener 隔离 + 资源跨域读取隔离（2026-09-09 补充）
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }
}
