# Meloyu Desktop 打包配置（electron-builder）
# 前置：sidecar 与前端产物已就位（见 desktop/README.md 构建顺序）：
# backend/dist-backend/meloyu-backend/   （PyInstaller --onedir 产物）
# frontend/dist/                          （vite build 产物）
appId: com.meloyu.desktop
productName: Meloyu
copyright: © 2026 Meloyu

# meloyu:// 深链协议声明：macOS 打包期写入 Info.plist
# CFBundleURLTypes——缺失则成品 mac 包收不到深链（运行时
# setAsDefaultProtocolClient 对打包后的 mac 应用无效，仅 win/linux 生效）
protocols:
  - name: Meloyu Activation
    schemes:
      - meloyu

directories:
  output: release
  buildResources: build

files:
  - src/**
  - package.json
  - "!**/*.md"

# 随包资源（asar 外）：sidecar 二进制目录 + 前端静态文件 + 托盘图标 + 三方声明
extraResources:
  - from: ../backend/dist-backend/meloyu-backend
    to: meloyu-backend
  - from: ../frontend/dist
    to: web
  - from: build/icon.png
    to: icon.png
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md

# License 公钥等敏感度低的构建期常量经环境注入 sidecar（打包脚本写 .env 时处理）；
# UPDATE_URL 发布时经 -c.extraMetadata 或环境变量注入

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # 代码签名（不签名起步零成本；转正路径 Azure Trusted Signing，
  # 见 desktop/README.md 签名策略表）
  # certificateSubjectName: "Meloyu"
  artifactName: Meloyu-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Meloyu
  # EULA 待法务定稿后经 nsis.license 挂载（安装器许可页）；当前随包携带
  # resources/THIRD-PARTY-NOTICES.md 履行三方声明义务

mac:
  # build/icon.png（512+）由 electron-builder 自动转换为 .icns
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.music
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Developer ID 签名 + 公证（P0 证书到位后启用）：
  # identity: "Developer ID Application: <subject>"
  # notarize: true（配合 afterSign 钩子统一公证主程序+sidecar 二进制）
  artifactName: Meloyu-${version}-${arch}.${ext}

dmg:
  title: Meloyu ${version}
  window: { width: 640, height: 400 }

# 自动更新源（P3 官网更新目录；发布时经 MELOYU_UPDATE_URL 注释解除或 CLI 覆盖）
# publish:
# - provider: generic
# url: https://meloyu.com/updates
