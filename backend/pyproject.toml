[project]
name = "meloyu-backend"
version = "0.18.0"
description = "Meloyu AI music creation system - FastAPI backend"
license = {text = "MIT"}
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI Depends() 默认值是官方惯例；SQLAlchemy 字符串关系触发 F821 误报
"app/api/v1/*" = ["B008"]
"app/models/*" = ["F821"]
"app/main.py" = ["B008"]
"app/core/security.py" = ["B008"]
